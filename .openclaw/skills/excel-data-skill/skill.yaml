# Excel 数据编辑 Skill - OpenClaw Skill 定义
# 
# 基于 Schema 标准的 Excel 数据编辑工具
# 支持 DataTable/Config/Language 三类数据的验证和编辑

name: excel-data-editor
version: 1.0.0
description: |
  AI 辅助的 Excel 数据编辑工具。
  
  支持三类数据：
  - DataTable: 游戏数据表，支持强类型访问和代码生成
  - Config: 配置表，键值对形式
  - Language: 多语言表，用于国际化
  
  主要功能：
  - Schema 验证：自动识别数据类型并验证合规性
  - 智能编辑：根据需求生成编辑脚本
  - 安全执行：自动备份、变更预览、失败回滚

author: AI Assistant
tags:
  - excel
  - data
  - editor
  - schema
  - datatable
  - config
  - language

# Skill 入口配置
entry:
  # Python 模块入口
  module: __init__
  function: create_skill
  
# 接口定义
interfaces:
  # 1. Schema 识别接口
  - name: identify_schema
    description: 识别 Excel 文件的 Schema 类型
    input:
      - name: excel_path
        type: string
        required: true
        description: Excel 文件路径
    output:
      - name: schema_type
        type: string
        description: Schema 类型 (datatable/config/language/unknown)
      - name: confidence
        type: float
        description: 识别置信度 (0-1)
      - name: details
        type: object
        description: 识别的详细信息

  # 2. Schema 验证接口
  - name: validate
    description: 验证 Excel 文件是否符合 Schema 标准
    input:
      - name: excel_path
        type: string
        required: true
        description: Excel 文件路径
      - name: schema_type
        type: string
        required: false
        description: 指定的 Schema 类型（自动识别时可不传）
    output:
      - name: is_valid
        type: boolean
        description: 是否通过验证
      - name: schema_type
        type: string
        description: 使用的 Schema 类型
      - name: errors
        type: array
        description: 错误列表
      - name: warnings
        type: array
        description: 警告列表
      - name: summary
        type: object
        description: 验证摘要

  # 3. 生成编辑脚本接口（核心 AI 接口）
  - name: generate_edit_script
    description: 根据需求生成编辑脚本
    input:
      - name: excel_path
        type: string
        required: true
        description: Excel 文件路径
      - name: requirements
        type: string
        required: true
        description: 自然语言描述的需求
      - name: schema_type
        type: string
        required: false
        description: Schema 类型（自动识别时可不传）
      - name: preview_only
        type: boolean
        required: false
        default: true
        description: 是否仅预览不实际执行
    output:
      - name: script_id
        type: string
        description: 脚本唯一标识
      - name: script_content
        type: string
        description: 生成的 Python 脚本内容
      - name: changes_preview
        type: object
        description: 变更预览
      - name: validation_result
        type: object
        description: 验证结果
      - name: estimated_impact
        type: object
        description: 影响评估

  # 4. 执行编辑脚本接口
  - name: execute_script
    description: 执行编辑脚本
    input:
      - name: script_id
        type: string
        required: true
        description: 脚本唯一标识
      - name: dry_run
        type: boolean
        required: false
        default: true
        description: 是否为预览模式
      - name: backup
        type: boolean
        required: false
        default: true
        description: 是否自动备份
    output:
      - name: success
        type: boolean
        description: 是否执行成功
      - name: execution_time
        type: number
        description: 执行时间（秒）
      - name: backup_path
        type: string
        description: 备份文件路径
      - name: changes_applied
        type: object
        description: 实际应用的变更
      - name: validation_after
        type: object
        description: 执行后的验证结果
      - name: error_info
        type: object
        description: 错误信息（失败时）

# 配置参数
config:
  # 默认路径配置
  paths:
    # 数据根目录（相对于项目根）
    data_root: "AAAGameData"
    
    # 各类型数据目录
    datatable_dir: "DataTables"
    config_dir: "Configs"
    language_dir: "Languages"
    
    # 输出目录
    output_dir: "Assets/AAAGame"
  
  # 验证配置
  validation:
    # 是否严格模式
    strict_mode: false
    
    # 最大错误数（超过则停止验证）
    max_errors: 50
    
    # 最大警告数
    max_warnings: 100
    
    # 是否检查命名规范
    check_naming: true
    
    # 是否检查数据类型
    check_types: true
  
  # 执行配置
  execution:
    # 是否默认预览模式
    default_dry_run: true
    
    # 是否自动备份
    auto_backup: true
    
    # 备份保留数量
    backup_keep_count: 10
    
    # 执行超时（秒）
    timeout: 300
  
  # AI 配置
  ai:
    # 默认模型
    default_model: "claude-3-sonnet"
    
    # 最大 tokens
    max_tokens: 4096
    
    # 温度
    temperature: 0.2
    
    # 是否启用思考过程
    enable_thinking: true

# 依赖项
dependencies:
  python:
    - pandas>=2.0.0
    - openpyxl>=3.1.0
    - xlsxwriter>=3.1.0
  
  system:
    - python>=3.10
    - git

